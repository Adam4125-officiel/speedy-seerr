# Builds this fork's image and pushes it to GHCR.
#
# Upstream's publishing workflows are guarded so they never run here; this is
# the only workflow in the fork that pushes anything.
name: Fork Image

on:
  push:
    branches: [adam]
  workflow_dispatch:
    inputs:
      base_version:
        description: >-
          Upstream version this build is based on, e.g. v3.4.1.
          Leave empty to detect the newest upstream release tag.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    # Never run if this branch ever lands back in the upstream repository.
    if: github.repository != 'seerr-team/seerr'
    name: Build and push to GHCR
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history and tags, so the upstream base version can be detected.
          fetch-depth: 0

      - name: Resolve image tags
        id: meta
        env:
          INPUT_BASE_VERSION: ${{ inputs.base_version }}
          RUN_NUMBER: ${{ github.run_number }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # Release tags live on upstream's main branch, not on develop, so the
          # newest v* tag by version order is the release this fork sits on.
          BASE="${INPUT_BASE_VERSION:-}"
          if [ -z "${BASE}" ]; then
            BASE="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1 || true)"
          fi
          if [ -z "${BASE}" ]; then
            git fetch --quiet --tags https://github.com/seerr-team/seerr.git || true
            BASE="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1 || true)"
          fi
          if [ -z "${BASE}" ]; then
            echo "Could not determine the upstream base version." >&2
            echo "Re-run with the base_version input set, e.g. v3.4.1." >&2
            exit 1
          fi

          # GHCR requires a lowercase namespace.
          IMAGE="ghcr.io/$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')/seerr"
          VERSION="${BASE}-adam.${RUN_NUMBER}"
          SHORT_SHA="$(git rev-parse --short HEAD)"

          {
            echo "image=${IMAGE}"
            echo "version=${VERSION}"
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:sha-${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

          echo "Building ${IMAGE}:${VERSION} and ${IMAGE}:sha-${SHORT_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            COMMIT_TAG=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Pushed"
            echo
            for t in ${TAGS//,/ }; do echo "- \`${t}\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
